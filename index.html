<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adem · profile</title>
<link rel="canonical" href="https://adem.is-a.dev/">
<meta property="og:url" content="https://adem.is-a.dev/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0e; --bg-glow:rgba(40,90,70,.38); --fg:#ececea; --muted:#8a8f8c; --dim:#5b605d;
  --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.035); --chip:rgba(255,255,255,.04);
  --ok:#4ade80; --idle:#facc15; --off:#6b706d;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5f3; --bg-glow:rgba(90,160,130,.28); --fg:#141716; --muted:#5d625f; --dim:#8c918e;
    --line:rgba(0,0,0,.14); --card:rgba(0,0,0,.03); --chip:rgba(0,0,0,.04); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f5f3; --bg-glow:rgba(90,160,130,.28); --fg:#141716; --muted:#5d625f; --dim:#8c918e;
  --line:rgba(0,0,0,.14); --card:rgba(0,0,0,.03); --chip:rgba(0,0,0,.04); color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--sans);
  display:flex;justify-content:center;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{ /* top glow */
  content:"";position:fixed;inset:0 0 auto 0;height:55vh;pointer-events:none;
  background:radial-gradient(ellipse 70% 100% at 50% 0%,var(--bg-glow),transparent 70%);
}
#spot{position:fixed;inset:0;pointer-events:none;opacity:.7;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,30%),rgba(120,200,170,.07),transparent 70%)}
main{position:relative;width:min(448px,100%);margin:clamp(40px,10vh,100px) 0 60px;padding:0 0 28px;
  border-inline:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
.plus{position:absolute;width:9px;height:9px;pointer-events:none}
.plus::before,.plus::after{content:"";position:absolute;background:var(--muted)}
.plus::before{left:4px;top:0;width:1px;height:9px}.plus::after{top:4px;left:0;height:1px;width:9px}
.hero{width:100%;padding:34px 28px 0;display:flex;flex-direction:column;align-items:center;position:relative}
.hero::before{content:"";position:absolute;inset:0 0 auto;border-top:1px solid var(--line)}
.avatar{width:160px;height:160px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
h1{margin:6px 0 0;font:500 clamp(40px,12vw,52px)/1.1 var(--mono);letter-spacing:-.02em;cursor:default;position:relative}
h1 .caret{display:inline-block;width:.09em;height:.85em;margin-left:.08em;background:var(--fg);vertical-align:-.05em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{margin:18px 0 0;text-align:center;max-width:36ch;font-size:15.5px;color:var(--fg);opacity:.92}
.card{width:calc(100% - 56px);margin:28px 0 28px;padding:16px 22px;border:1px solid var(--line);border-radius:14px;background:var(--card);
  backdrop-filter:blur(6px);display:grid;grid-template-columns:auto 1fr;gap:10px 22px;align-items:center;font-size:14px}
.card dt{color:var(--muted);text-align:right}
.card dd{margin:0;font-weight:500;display:flex;align-items:center;gap:9px;min-width:0}
.card dd span.u{border-bottom:1px dotted var(--dim);padding-bottom:1px}
.card small{font-weight:400;color:var(--muted);font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none}
[data-state="online"] .dot{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
[data-state="idle"] .dot{background:var(--idle)}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.skills{position:relative;width:100%;padding:12px 0;border-block:1px solid var(--line);display:flex;flex-direction:column;gap:12px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.row{display:flex;width:max-content;gap:10px;animation:slide var(--d,38s) linear infinite}
.row.rev{animation-direction:reverse}
.skills:hover .row{animation-play-state:paused}
@keyframes slide{to{transform:translateX(calc(-50% - 5px))}}
.chip{display:flex;align-items:center;gap:11px;padding:9px 16px 9px 12px;border-radius:12px;background:var(--chip);border:1px solid transparent;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--line);background:var(--card)}
.chip i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);font-style:normal;color:#fff;flex:none}
.chip b{display:block;font:600 12.5px/1.2 var(--sans)}
.chip em{display:block;font:400 11px/1.3 var(--sans);font-style:normal;color:var(--muted);white-space:nowrap}
nav{margin-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font:400 14px var(--mono)}
nav a{color:var(--muted);text-decoration:none;transition:color .15s}
nav a::before{content:"[ ";color:var(--dim)}nav a::after{content:" ]";color:var(--dim)}
nav a:hover,nav a:focus-visible{color:var(--fg);outline:none}
nav a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.social{margin-top:18px;display:flex;gap:22px}
.social a{color:var(--muted);display:grid;transition:color .15s,transform .15s}
.social a:hover,.social a:focus-visible{color:var(--fg);transform:translateY(-2px);outline:none}
.social svg{width:18px;height:18px;fill:currentColor}
#theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px;z-index:5}
#theme:hover{color:var(--fg)}
#view{display:none;position:fixed;inset:0;z-index:4;background:var(--bg);overflow-y:auto;padding:80px 24px 40px}
#view.on{display:block}
#view .in{max-width:520px;margin:0 auto}
#view h2{font:500 26px var(--mono);margin:0 0 18px}
#view p,#view li{color:var(--muted)}
#view button{margin-top:20px;font:400 14px var(--mono);background:none;border:1px solid var(--line);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer}
#view ul{padding:0;list-style:none;display:grid;gap:10px}
#view li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
#view li strong{color:var(--fg);font-weight:500}
#gb form{display:grid;gap:10px;margin-top:6px}
#gb input,#gb textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
#gb input:focus,#gb textarea:focus{outline:1px solid var(--muted)}

#cat{position:fixed;left:0;top:0;width:58px;height:50px;pointer-events:none;z-index:9;will-change:transform}
#cat svg{width:100%;height:100%;overflow:visible;display:block;transition:transform .2s;filter:drop-shadow(0 0 1px rgba(110,125,150,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.25))}
#cat.flip svg{transform:scaleX(-1)}
#cat .runv{display:none}
#cat.run .runv{display:block}#cat.run .sitv{display:none}
#cat .tail{transform-box:view-box;transform-origin:14px 44px;animation:wag 2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(16deg)}}
#cat .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#cat .rl{transform-box:fill-box;transform-origin:50% 8%}
#cat.run .rb1,#cat.run .rf2{animation:gal .2s ease-in-out infinite alternate}
#cat.run .rb2,#cat.run .rf1{animation:gal .2s ease-in-out infinite alternate-reverse}
@keyframes gal{from{transform:rotate(-40deg)}to{transform:rotate(40deg)}}
#cat.run .rbob{transform-box:view-box;animation:rbob .2s ease-in-out infinite alternate}
@keyframes rbob{from{transform:translateY(1px) rotate(-1.5deg)}to{transform:translateY(-3px) rotate(1.5deg)}}
#cat .rtail{transform-box:view-box;transform-origin:14px 35px;animation:rwave .2s ease-in-out infinite alternate}
@keyframes rwave{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
#cat .z{opacity:0;font:700 9px var(--mono);fill:var(--muted);transition:opacity .4s}
#cat.nap .z{opacity:1}
#cat.nap .eye{animation:none;transform:scaleY(.12)}
@media (prefers-reduced-motion:reduce){.row,.caret,.dot,.cl,#cat *{animation:none!important}}
@media (max-width:420px){.card{padding:14px 16px;gap:9px 14px}}
</style>
</head>

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// skills marquee (two rows, opposite directions, seamless loop)
(function(){
  const host=$("#skills"),list=CONFIG.skills,half=Math.ceil(list.length/2);
  const chip=([n,d,ic,col])=>`<div class="chip"><i style="background:${col}">${esc(ic)}</i><div><b>${esc(n)}</b><em>${esc(d)}</em></div></div>`;
  [[list.slice(0,half),"",40],[list.slice(half).concat(list.slice(0,1)),"rev",34]].forEach(([items,cls,dur])=>{
    const r=document.createElement("div");r.className="row "+cls;r.style.setProperty("--d",dur+"s");
    const once=items.map(chip).join("");r.innerHTML=once+once+once+once;
    r.style.animationName="slide";host.appendChild(r);
  });
  // each row repeats content 4x; translating -50% = 2 repeats → seamless
})();

// overlay pages (blog / projects / about / guestbook) with hash routing
const view=$("#view"),vin=$("#vin");
function guestbook(){
  let notes=[];try{notes=JSON.parse(localStorage.getItem("gb")||"[]")}catch(e){}
  const draw=()=>{$("#gbl").innerHTML=notes.length?notes.map(n=>`<li><strong>${esc(n.n)}</strong><br>${esc(n.m)}</li>`).join(""):"<li>No entries yet. Sign first.</li>"};
  vin.innerHTML=`<h2>guestbook</h2><div id="gb"><form id="gf"><input id="gn" placeholder="name" maxlength="30" required><textarea id="gm" rows="3" placeholder="leave a note" maxlength="240" required></textarea><button>sign</button></form></div><ul id="gbl" style="margin-top:22px"></ul><button id="bk">back</button>`;
  draw();
  $("#gf").onsubmit=e=>{e.preventDefault();notes.unshift({n:$("#gn").value.trim(),m:$("#gm").value.trim()});notes=notes.slice(0,50);
    try{localStorage.setItem("gb",JSON.stringify(notes))}catch(_){}draw();e.target.reset()};
}
function route(){
  const p=location.hash.slice(1),pg=CONFIG.pages;
  if(!p||!CONFIG.nav.some(n=>n[0]===p)){view.classList.remove("on");document.body.style.overflow="";return}
  if(p==="guestbook")guestbook();
  else if(Array.isArray(pg[p]))vin.innerHTML=`<h2>${esc(p)}</h2><ul>${pg[p].map(([t,d])=>`<li><strong>${esc(t)}</strong><br>${esc(d)}</li>`).join("")}</ul><button id="bk">back</button>`;
  else vin.innerHTML=`<h2>${esc(p)}</h2><p>${esc(pg[p]||"Nothing here yet.")}</p><button id="bk">back</button>`;
  view.classList.add("on");view.scrollTop=0;document.body.style.overflow="hidden";
  const b=$("#bk");if(b){b.onclick=()=>{location.hash=""};b.focus()}
}
addEventListener("hashchange",route);addEventListener("keydown",e=>{if(e.key==="Escape")location.hash=""});route();

// cursor spotlight
addEventListener("pointermove",e=>{const s=$("#spot").style;s.setProperty("--mx",e.clientX+"px");s.setProperty("--my",e.clientY+"px")},{passive:true});

// cat that chases the cursor
(function(){
  const cat=$("#cat"),eyes=$("#eyes");
  let cx=innerWidth*.15,cy=innerHeight-70,tx=null,ty=null,idle=0,last=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;idle=0;cat.classList.remove("nap")},{passive:true});
  function tick(t){
    const dt=Math.min(32,t-last||16)/16;last=t;
    if(tx!==null){
      const dx=tx-cx,dy=ty+30-cy,d=Math.hypot(dx,dy);
      if(d>44){
        const sp=Math.min(8,1.4+(d-44)*.1)*dt;
        cx+=dx/d*sp;cy+=dy/d*sp;
        cat.classList.add("run");cat.classList.remove("nap");idle=0;
        if(Math.abs(dx)>6)cat.classList.toggle("flip",dx<0);
      }else{
        cat.classList.remove("run");idle+=dt;
        if(idle>260)cat.classList.add("nap");
      }
      eyes.setAttribute("transform",`translate(${clamp(dx/55,-1.4,1.4).toFixed(2)} ${clamp(dy/55,-1,1.2).toFixed(2)})`);
    }
    cat.style.transform=`translate3d(${(cx-27).toFixed(1)}px,${(cy-24).toFixed(1)}px,0)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

  cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");
  r.dataset.theme=cur==="dark"?"light":"dark"};
